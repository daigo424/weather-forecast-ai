name: Sandbox ML Pipeline

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pipeline:
    name: weather_forecast_pipeline (Airflow DAG)
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      LGBM_N_JOBS: "2"
      PROJECT_ROOT: ${{ github.workspace }}
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:///${{ github.workspace }}/airflow-meta.db
      DB_HOST: ${{ secrets.SANDBOX_DB_HOST }}
      DB_USERNAME: ${{ secrets.SANDBOX_DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.SANDBOX_DB_PASSWORD }}
      DB_PORT: "5432"
      FEAST_DB_NAME: ${{ secrets.SANDBOX_FEAST_DB_NAME }}
      DB_SSLMODE: require
      REDIS_HOST: ${{ secrets.SANDBOX_REDIS_HOST }}
      REDIS_PORT: ${{ secrets.SANDBOX_REDIS_PORT }}
      REDIS_USERNAME: ${{ secrets.SANDBOX_REDIS_USERNAME }}
      REDIS_PASSWORD: ${{ secrets.SANDBOX_REDIS_PASSWORD }}
      REDIS_SSL: "true"
      SKIP_FETCH_DATA: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Cache golden dataset
        id: cache-golden
        uses: actions/cache@v4
        with:
          path: data/golden-dataset
          key: golden-dataset-${{ hashFiles('data/golden-dataset.dvc') }}

      - name: Configure AWS credentials (OIDC)
        if: steps.cache-golden.outputs.cache-hit != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.TEST_AWS_ACCOUNT_ID }}:role/GitHubActionsWorkloadDeployRole
          aws-region: ap-northeast-1

      - name: Pull golden dataset from S3
        if: steps.cache-golden.outputs.cache-hit != 'true'
        run: uv run dvc pull data/golden-dataset.dvc

      - name: Link golden dataset as raw data
        run: ln -s ${{ github.workspace }}/data/golden-dataset ${{ github.workspace }}/data/01_raw

      - name: Init Airflow metadata DB
        run: uv run airflow db migrate

      - name: Run pipeline
        run: uv run airflow dags test weather_forecast_pipeline

      - name: Upload Airflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-logs-${{ github.sha }}
          path: ~/airflow/logs/
