name: ML Pipeline

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  pipeline:
    name: weather_forecast_pipeline (Airflow DAG)
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      LGBM_N_JOBS: "2"
      PROJECT_ROOT: ${{ github.workspace }}
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/dags
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:///airflow-meta.db

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: DB migrate
        run: uv run alembic upgrade head

      - name: Init Airflow metadata DB
        run: uv run airflow db migrate

      - name: Run pipeline
        run: uv run airflow dags test weather_forecast_pipeline

      - name: Upload Airflow logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airflow-logs-${{ github.sha }}
          path: ~/airflow/logs/
