name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options: [test, prod]
      api:
        description: "Deploy api"
        type: boolean
        default: false
      frontend:
        description: "Deploy frontend"
        type: boolean
        default: false
      ml_workflow:
        description: "Deploy ml-workflow"
        type: boolean
        default: false
      mlflow:
        description: "Deploy mlflow"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  # ▼ 新しいサービスを追加するときは inputs に boolean を追加し、ここにも追記する
  # 命名規則: Dockerfile.{service} / REPLACE_WITH_ECR_{SERVICE_UPPER}_URL
  TARGET_SERVICES: "api frontend ml-workflow mlflow"

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Block prod deployment from non-main branch
        if: github.event.inputs.environment == 'prod' && github.ref != 'refs/heads/main'
        run: |
          echo "prod deployment is only allowed from main branch (current: ${{ github.ref }})"
          exit 1

  # input name (ml_workflow) → service name (ml-workflow) の変換は tr '_' '-' で自動処理
  prepare:
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      matrix:   ${{ steps.set.outputs.matrix }}
      services: ${{ steps.set.outputs.services }}
    steps:
      - id: set
        run: |
          INPUTS='${{ toJSON(inputs) }}'
          svcs=()
          for svc in $TARGET_SERVICES; do
            key=$(echo "$svc" | tr '-' '_')
            echo "$INPUTS" | jq -e --arg k "$key" '.[$k] | tostring == "true"' > /dev/null && svcs+=("$svc")
          done

          includes=()
          for svc in "${svcs[@]}"; do
            dockerfile="Dockerfile.$svc"
            placeholder=$(echo "REPLACE_WITH_ECR_${svc}_URL" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
            includes+=("{\"service\":\"$svc\",\"dockerfile\":\"$dockerfile\",\"placeholder\":\"$placeholder\"}")
          done

          joined=$(IFS=,; echo "${includes[*]}")
          echo "matrix={\"include\":[$joined]}" >> "$GITHUB_OUTPUT"
          echo "services=$(IFS=,; echo "${svcs[*]}")" >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────
  # サービスごとに並列で Build & Push & kustomize 更新
  # ─────────────────────────────────────────────
  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.services != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Resolve account ID
        id: account
        run: |
          case "${{ inputs.environment }}" in
            prod) echo "id=${{ vars.PROD_ACCOUNT_ID }}" >> "$GITHUB_OUTPUT" ;;
            test) echo "id=${{ vars.TEST_ACCOUNT_ID }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ steps.account.outputs.id }}:role/GitHubActionsWorkloadDeployRole
          aws-region: ap-northeast-1

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image variables
        id: img
        run: |
          echo "ecr_base=${{ steps.account.outputs.id }}.dkr.ecr.ap-northeast-1.amazonaws.com/weather-forecast-ai-${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          echo "tag=$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.service }}
        run: |
          docker build -f "infra/docker/${{ matrix.dockerfile }}" \
            -t "${{ steps.img.outputs.ecr_base }}/${{ matrix.service }}:${{ steps.img.outputs.tag }}" .
          docker push "${{ steps.img.outputs.ecr_base }}/${{ matrix.service }}:${{ steps.img.outputs.tag }}"

      - name: Update ${{ matrix.service }} image tag
        run: |
          cd "infra/k8s/overlays/${{ inputs.environment }}/${{ matrix.service }}"
          kustomize edit set image \
            "${{ matrix.placeholder }}=${{ steps.img.outputs.ecr_base }}/${{ matrix.service }}:${{ steps.img.outputs.tag }}"

      - name: Upload kustomization artifact
        uses: actions/upload-artifact@v4
        with:
          name: kustomization-${{ matrix.service }}
          path: infra/k8s/overlays/${{ inputs.environment }}/${{ matrix.service }}/kustomization.yaml

  # ─────────────────────────────────────────────
  # 全サービスの kustomization を集約してコミット & PR
  # ─────────────────────────────────────────────
  commit:
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.services != '' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download kustomization artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: kustomization-*
          path: .kustomizations

      - name: Apply kustomization changes
        run: |
          IFS=',' read -ra svcs <<< "${{ needs.prepare.outputs.services }}"
          for svc in "${svcs[@]}"; do
            cp ".kustomizations/kustomization-$svc/kustomization.yaml" \
               "infra/k8s/overlays/${{ inputs.environment }}/$svc/kustomization.yaml"
          done

      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Create and merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          TAG="$GITHUB_SHA"
          BRANCH="deploy/${{ inputs.environment }}/image-tags-$TAG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add infra/k8s/overlays/
          git diff --staged --quiet && echo "No changes to deploy" && exit 0

          git commit -m "chore(${{ inputs.environment }}): update image tags to $TAG"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --title "chore(${{ inputs.environment }}): update image tags to $TAG" \
            --body "$(printf 'Environment: **%s**\nDeployed by: @%s\nServices: `%s`\nWorkflow run: %s' \
              '${{ inputs.environment }}' \
              '${{ github.actor }}' \
              '${{ needs.prepare.outputs.services }}' \
              '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')" \
            --base ${{ github.ref_name }} \
            --head "$BRANCH")

          gh pr merge "$PR_URL" --squash --delete-branch
