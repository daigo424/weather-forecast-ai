services:
  db:
    image: postgres:16
    container_name: weather-db
    environment:
      - POSTGRES_DB=app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.mlflow
    container_name: mlflow
    working_dir: /app
    volumes:
      - ../..:/app
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///data/mlflow.db
      --default-artifact-root ./data/mlruns
    ports:
      - "5000:5000"

  airflow:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.airflow
    container_name: airflow
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - MLFLOW_TRACKING_URI=${MLFLOW_REMOTE_TRACKING_URI:-sqlite:////app/data/mlflow.db}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME:-}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD:-}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app
      - GIT_PYTHON_REFRESH=quiet
      - LGBM_N_JOBS=1
    volumes:
      - ../../dags:/opt/airflow/dags
      - ../..:/opt/airflow/project
      - ../../data:/app/data
    ports:
      - "8080:8080"
    command: airflow standalone

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    container_name: weather-api
    depends_on:
      db:
        condition: service_healthy
      mlflow:
        condition: service_started
    environment:
      - MLFLOW_TRACKING_URI=${MLFLOW_REMOTE_TRACKING_URI:-sqlite:////app/data/mlflow.db}
      - MLFLOW_TRACKING_USERNAME=${MLFLOW_TRACKING_USERNAME:-}
      - MLFLOW_TRACKING_PASSWORD=${MLFLOW_TRACKING_PASSWORD:-}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/app
      - GIT_PYTHON_REFRESH=quiet
    volumes:
      - ../../data:/app/data
    ports:
      - "8000:8000"

  frontend:
    image: python:3.12-slim
    container_name: weather-frontend
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000
    volumes:
      - ../../src/streamlit_app.py:/app/streamlit_app.py
      - frontend_cache:/root/.cache/pip
    working_dir: /app
    command: >
      sh -c "pip install --quiet streamlit plotly requests pandas &&
      streamlit run streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true"
    ports:
      - "8501:8501"

volumes:
  frontend_cache:
  postgres_data:
