apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-forecast-mlops-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  weather-forecast-mlops.json: |
    {
      "id": null,
      "uid": "weather-mlops",
      "title": "Weather Forecast MLOps",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "API Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "rate(http_requests_total{job=\"weather-api\"}[5m])",
              "legendFormat": "{{method}} {{path}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 2,
          "title": "API Error Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "targets": [
            {
              "expr": "rate(http_requests_total{job=\"weather-api\",status=~\"5..\"}[5m])",
              "legendFormat": "5xx errors",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "fixed", "fixedColor": "red" }
            }
          }
        },
        {
          "id": 3,
          "title": "API P95 Latency",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job=\"weather-api\"}[5m]))",
              "legendFormat": "p95 latency",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "fixed", "fixedColor": "orange" }
            }
          }
        },
        {
          "id": 4,
          "title": "Pipeline Success Rate",
          "type": "stat",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "argo_workflows_count{status=\"Succeeded\"} / ignoring(status) sum without(status)(argo_workflows_count)",
              "legendFormat": "Success Rate",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.8 },
                  { "color": "green", "value": 0.95 }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Pipeline Duration",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "targets": [
            {
              "expr": "argo_workflows_duration_gauge",
              "legendFormat": "{{name}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 6,
          "title": "Pod Memory Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "targets": [
            {
              "expr": "container_memory_usage_bytes{namespace=~\"weather|argo|mlflow\"}",
              "legendFormat": "{{namespace}}/{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "bytes",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 7,
          "title": "Evaluation Gate (Pass/Fail)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 16 },
          "targets": [
            {
              "expr": "weather_forecast_evaluation_passed{job=\"weather_evaluate\"}",
              "legendFormat": "{{location}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "mappings": [
                { "type": "value", "options": { "0": { "text": "FAIL", "color": "red" }, "1": { "text": "PASS", "color": "green" } } }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              }
            }
          }
        },
        {
          "id": 8,
          "title": "Evaluation MAE per Target",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 10, "x": 4, "y": 16 },
          "targets": [
            {
              "expr": "weather_forecast_evaluation_mae{job=\"weather_evaluate\"}",
              "legendFormat": "{{target}}",
              "refId": "A"
            },
            {
              "expr": "weather_forecast_evaluation_baseline_mae{job=\"weather_evaluate\"}",
              "legendFormat": "{{target}} baseline",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" }
            },
            "overrides": [
              {
                "matcher": { "id": "byRegexp", "options": ".*baseline.*" },
                "properties": [{ "id": "custom.lineStyle", "value": { "dash": [10, 10], "fill": "dash" } }]
              }
            ]
          }
        },
        {
          "id": 9,
          "title": "Evaluation RMSE per Target",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 10, "x": 14, "y": 16 },
          "targets": [
            {
              "expr": "weather_forecast_evaluation_rmse{job=\"weather_evaluate\"}",
              "legendFormat": "{{target}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" }
            }
          }
        },
        {
          "id": 10,
          "title": "Evaluation Bias per Target",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "targets": [
            {
              "expr": "weather_forecast_evaluation_bias{job=\"weather_evaluate\"}",
              "legendFormat": "{{target}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "palette-classic" },
              "custom": { "thresholdsStyle": { "mode": "line" } },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "transparent", "value": null },
                  { "color": "red", "value": -0.5 },
                  { "color": "transparent", "value": 0 },
                  { "color": "red", "value": 0.5 }
                ]
              }
            }
          }
        }
      ]
    }
