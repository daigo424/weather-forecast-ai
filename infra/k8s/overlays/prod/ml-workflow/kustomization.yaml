apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo
resources:
  - ../../../base/ml-workflow
  - ml-workflow-env.yaml
  - artifact-repository.yaml
patches:
  - patch: |-
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: ml-workflow
        annotations:
          eks.amazonaws.com/role-arn: REPLACE_WITH_ARGO_WORKFLOWS_IRSA_ARN
    target:
      kind: ServiceAccount
      name: ml-workflow
images:
  - name: REPLACE_WITH_ECR_WORKFLOW_URL
    newName: REPLACE_WITH_ECR_WORKFLOW_URL
    newTag: latest
