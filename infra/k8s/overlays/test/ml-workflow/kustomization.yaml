apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argo
resources:
- ../../../base/ml-workflow
- ml-workflow-env.yaml
- artifact-repository.yaml
patches:
- patch: |-
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: ml-workflow
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::897913033200:role/weather-forecast-ai-test-ml-workflow-role
  target:
    kind: ServiceAccount
    name: ml-workflow
images:
- name: REPLACE_WITH_ECR_WORKFLOW_URL
  newName: 897913033200.dkr.ecr.ap-northeast-1.amazonaws.com/weather-forecast-ai-test/ml-workflow
  newTag: a0ade0e
