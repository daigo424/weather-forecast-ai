apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: weather
resources:
- ../../../base/api
patches:
- patch: |-
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: weather-api
      annotations:
        eks.amazonaws.com/role-arn: arn:aws:iam::897913033200:role/weather-forecast-ai-test-weather-api-role
  target:
    kind: ServiceAccount
    name: weather-api
images:
- name: REPLACE_WITH_ECR_API_URL
  newName: 897913033200.dkr.ecr.ap-northeast-1.amazonaws.com/weather-forecast-ai-test/api
  newTag: a31e0d4
