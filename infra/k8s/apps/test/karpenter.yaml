apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: public.ecr.aws/karpenter
    chart: karpenter
    targetRevision: "1.5.6"
    helm:
      valuesObject:
        settings:
          clusterName: weather-forecast-ai-test
          interruptionQueue: weather-forecast-ai-test-karpenter
        serviceAccount:
          annotations:
            eks.amazonaws.com/role-arn: arn:aws:iam::897913033200:role/weather-forecast-ai-test-karpenter
        replicas: 1
        controller:
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
