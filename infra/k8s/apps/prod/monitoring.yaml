apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "77.x.x"
    helm:
      valuesObject:
        grafana:
          adminPassword: admin
          image:
            registry: 916868259190.dkr.ecr.ap-northeast-1.amazonaws.com/docker.io
            repository: grafana/grafana
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
        prometheus:
          prometheusSpec:
            retention: 7d
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
        alertmanager:
          enabled: false
        prometheus-pushgateway:
          enabled: true
          image:
            repository: 916868259190.dkr.ecr.ap-northeast-1.amazonaws.com/docker.io/prom/pushgateway
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 3
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
