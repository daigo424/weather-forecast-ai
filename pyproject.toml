[project]
name = "weather-forecast-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "setuptools",
    "mlflow==3.11.1",
    "scikit-learn>=1.8.0",
    "lightgbm>=4.6.0",
    "xgboost>=3.2.0",
    "pandas==2.2.3",
    "numpy>=1.26.4",
    "pyarrow>=15.0",
    "feast[redis]>=0.47.0",
    "psycopg2-binary>=2.9",
    "cloudpathlib[s3]>=0.18.0",
    "s3fs>=2024.1.0",
    "boto3>=1.34.0",
    "evidently>=0.7.21",
    "optuna>=3.6.0",
    "prometheus-client>=0.20.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "requests>=2.31.0",
]

[tool.pytest.ini_options]
testpaths = ["src/tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.13"
mypy_path = ["src"]
ignore_missing_imports = true
explicit_package_bases = true

[dependency-groups]
dev = [
    "pydevd-pycharm>=262.6228.39",
    "ipywidgets>=8.0.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "apache-airflow>=3.2.1",
    "pendulum>=3.2.0",
    "dvc>=3.67.1",
    "dvc-s3>=3.3.0",
    "pytest>=9.0.3",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "pandas-stubs~=2.2.3",
    "scipy-stubs~=1.17.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]
